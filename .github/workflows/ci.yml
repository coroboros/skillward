name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      recover_npm_0_1_3:
        description: Publish only the existing 0.1.3 npm release artifact
        type: boolean
        default: false
      diagnose_npm:
        description: Check npm authentication and target package access without publishing
        type: boolean
        default: false

jobs:
  ci:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.recover_npm_0_1_3 && !inputs.diagnose_npm) }}
    uses: coroboros/ci/.github/workflows/rust-packages.yml@v0
    permissions:
      contents: write   # GitHub Release + commit-back on tag
      id-token: write   # crates.io + npm OIDC publish on tag
    secrets:
      # First publish of a new crate only — drop once Trusted Publishing is configured.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Binary distribution ([package.metadata.dist] in Cargo.toml) — both optional:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      NPM_PACKAGE_REGISTRY_TOKEN: ${{ secrets.NPM_PACKAGE_REGISTRY_TOKEN }}

  recover-npm:
    if: ${{ github.repository == 'coroboros/skillward' && github.event_name == 'workflow_dispatch' && inputs.recover_npm_0_1_3 && !inputs.diagnose_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the original release and retrieve its npm artifact
        shell: bash
        run: |
          set -euo pipefail
          repo=coroboros/skillward
          tag_object="$(gh api "repos/${repo}/git/ref/tags/0.1.3" --jq '.object | select(.type == "tag") | .sha')"
          test -n "${tag_object}"
          gh api "repos/${repo}/git/tags/${tag_object}" --jq .object \
            | jq -e '.type == "commit" and .sha == "7f5fdf84598fcd0e9f5e6877e4a4c46eda66cbb7"'
          gh api "repos/${repo}/actions/runs/33994757230" \
            | jq -e '.head_sha == "7f5fdf84598fcd0e9f5e6877e4a4c46eda66cbb7" and .head_branch == "0.1.3" and .event == "push" and .status == "completed"'
          gh release view 0.1.3 --repo "${repo}" --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false'
          gh api "repos/${repo}/releases/assets/546367594" -H 'Accept: application/octet-stream' > skillward-npm-package.tar.gz
          test "$(sha256sum skillward-npm-package.tar.gz | cut -d ' ' -f 1)" = 'bf16e304af649d6566965bf431e6b454c79f5b393a72694c78331d4d97b0a5ec'
          tar -xOf skillward-npm-package.tar.gz package/package.json \
            | jq -e '.name == "@coroboros/skillward" and .version == "0.1.3" and .repository == "https://github.com/coroboros/skillward"'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Publish and verify the npm shim
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${NODE_AUTH_TOKEN}" || { echo '::error::NPM_PACKAGE_REGISTRY_TOKEN is required'; exit 1; }
          npm publish --provenance --access public --ignore-scripts ./skillward-npm-package.tar.gz
          integrity="sha512-$(openssl dgst -sha512 -binary skillward-npm-package.tar.gz | openssl base64 -A)"
          npm view @coroboros/skillward@0.1.3 dist --json \
            | jq -e --arg integrity "${integrity}" '.integrity == $integrity and (.attestations.url | type == "string")'

  diagnose-npm:
    if: ${{ github.repository == 'coroboros/skillward' && github.event_name == 'workflow_dispatch' && inputs.diagnose_npm }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Check npm authentication and package permission
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const target = '@coroboros/skillward';
          const run = (...args) => spawnSync('npm', [...args, '--registry=https://registry.npmjs.org', '--logs-max=0'], {
            encoding: 'utf8', timeout: 60000, maxBuffer: 1024 * 1024, stdio: ['ignore', 'pipe', 'pipe'],
          });
          const identity = run('whoami');
          const authenticated = identity.status === 0 && Boolean(identity.stdout.trim());
          let targetPackagePresent = false;
          let targetPackagePermission = 'unknown';
          if (authenticated) {
            const access = run('access', 'list', 'packages', identity.stdout.trim(), target, '--json');
            if (access.status === 0) {
              try {
                const packages = JSON.parse(access.stdout);
                targetPackagePresent = Object.hasOwn(packages, target);
                const permission = packages[target];
                targetPackagePermission = !targetPackagePresent ? 'absent'
                  : ['read-only', 'read-write'].includes(permission) ? permission : 'unknown';
              } catch { /* Report unknown without exposing registry responses. */ }
            } else {
              try {
                const code = JSON.parse(access.stdout).error.code;
                const categories = {
                  E401: 'query-unauthorized', E403: 'query-forbidden', E404: 'query-not-found',
                  ENEEDAUTH: 'query-needs-auth', EUSAGE: 'query-invalid-usage',
                };
                if (Object.hasOwn(categories, code)) targetPackagePermission = categories[code];
              } catch { /* Keep unknown for non-JSON or unrecognized failures. */ }
            }
          }
          console.log(JSON.stringify({ authenticated, targetPackagePresent, targetPackagePermission }));
          NODE
